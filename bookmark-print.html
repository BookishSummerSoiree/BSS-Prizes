/* Clothing tags print landscape (11"×8.5") — overridden dynamically per
   selected tag type via #page-orientation-style, injected in buildSheets(). */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0}
.controls{background:#3C3489;color:white;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.controls h1{font-size:15px;font-weight:600;flex:1}
.ctrl-select{font-size:13px;padding:5px 9px;border-radius:6px;border:none;background:rgba(255,255,255,.2);color:white}
.ctrl-select option{color:#2C2C2C;background:white}
.btn-print{background:white;color:#3C3489;border:none;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.btn-close{background:rgba(255,255,255,.15);color:white;border:1.5px solid rgba(255,255,255,.6);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.loading{text-align:center;padding:40px;color:#666;font-size:14px}
.sheet{width:fit-content;margin:0 auto;background:white}
/* Visual-only representation of the physical 8.5"×11" sheet with the 8"×10"
   tag table centered inside it (0.25in side / 0.5in top-bottom margin) — so
   the printer allowance is actually visible on screen, not just baked into
   the invisible @page rule above which only applies once you print/export. */
.page-frame{width:8.5in;margin:28px auto;background:white;box-shadow:0 2px 14px rgba(0,0,0,.18);position:relative;padding:0.5in 0.25in;box-sizing:border-box}
.page-frame.landscape{width:11in;padding:0.25in 0.5in}
.page-frame-label{position:absolute;top:-20px;left:0;font-size:11px;color:#888;font-family:-apple-system,sans-serif}
.page-frame .sheet{outline:1px dashed #bbb}
@media print{
  .page-frame{width:auto;box-shadow:none;padding:0;margin:0}
  .page-frame-label{display:none}
  .page-frame .sheet{outline:none}
}

/* ── BOOK tag: 2"×5", 4 cols × 2 rows = 8in × 10in table ──
   Uses your real template PNG as background (logo, headline, body, both
   lines, and heart all baked in). Only three overlays, per your exact
   coordinates:
     name/logo  centered horiz, vert-centered 1.14in–2.12in, max width 1.75in
     QR code    .68×.68in, left .22in, top 4.13in
     caption    centered at 1.42in horiz, vert-centered 4.2in–4.74in
*/
.page-book{display:grid;grid-template-columns:repeat(4,2in);grid-template-rows:repeat(2,5in);gap:0;background:white;page-break-after:always}
.bm{width:2in;height:5in;overflow:hidden;background-color:white;background-image:var(--bm-template-url);background-size:100% 100%;background-repeat:no-repeat;border:none;position:relative;font-family:Calibri,Carlito,sans-serif}
.bm-donor{position:absolute;left:0;right:0;top:1.14in;height:.98in;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bm-donor img{max-width:1.75in;max-height:100%;object-fit:contain}
.bm-donor-name{font-family:'Adobe Garamond Pro','EB Garamond',Garamond,serif;font-variant:small-caps;font-size:16pt;font-weight:600;color:#1B2A4A;text-align:center;line-height:1.4;width:1.75in;margin:0 auto}
.bm-qr-img{width:.68in;height:.68in;position:absolute;left:.22in;top:4.13in}
.bm-qr-img img{width:100%;height:100%}
.bm-qr-ph{width:.68in;height:.68in;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:6px;color:#aaa;text-align:center;position:absolute;left:.22in;top:4.13in}
.bm-qr-lbl{position:absolute;left:1.42in;transform:translateX(-50%);top:4.2in;height:.54in;width:max-content;display:flex;align-items:center;justify-content:center;font-family:Calibri,Carlito,sans-serif;font-size:10.6pt;color:#333;text-align:center;line-height:1.25;white-space:nowrap}

/* ── CLOTHING tag: 2.5"×4", printed landscape ──
   Uses your actual template PNG as the background — hole, logo, circle,
   headline, body text, both navy lines, and the heart are all baked into
   that image at their real, correct positions. Nothing here re-derives
   or redraws any of that, which removes the risk of me re-measuring it
   wrong. Only three things are ever overlaid on top, because only these
   three actually change per prize:
     size value        centered inside the circle,  top .96in, h .571in
     donor name/logo   centered in the blank zone,  top 1.84in, h .5in
     QR code + caption "Scan the QR code to / visit [pronoun] website"
                        QR: .45×.45in, left .39in, top 3.43in
                        caption: 1×.208in, right .39in, top 3.5in
*/
.page-clothing{display:grid;grid-template-columns:repeat(4,2.5in);grid-template-rows:repeat(2,4in);gap:0.02in;background:white;page-break-after:always}
.ct{width:2.5in;height:4in;overflow:hidden;background-color:white;background-image:var(--ct-template-url);background-size:100% 100%;background-repeat:no-repeat;border:none;position:relative;font-family:Calibri,Carlito,sans-serif}
.ct-size-value-wrap{position:absolute;left:0;right:0;top:.96in;height:.571in;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ct-size-value{font-family:'Adobe Garamond Pro','EB Garamond',Garamond,serif;font-variant:small-caps;font-size:20pt;color:#1B2A4A;line-height:1;white-space:nowrap;display:inline-block}
.ct-donor{position:absolute;left:6px;right:6px;top:1.75in;height:.59in;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ct-donor img{max-width:2in;max-height:min(.75in,100%);object-fit:contain}
.ct-donor-name{font-family:'Adobe Garamond Pro','EB Garamond',Garamond,serif;font-variant:small-caps;font-size:16pt;font-weight:600;color:#1B2A4A;text-align:center;line-height:1.4;width:100%;padding:0 4px}
.ct-qr-img{width:.45in;height:.45in;position:absolute;left:.39in;top:3.43in}
.ct-qr-img img{width:100%;height:100%}
.ct-qr-ph{width:.45in;height:.45in;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:5px;color:#aaa;position:absolute;left:.39in;top:3.43in}
.ct-qr-lbl{position:absolute;left:1.57in;transform:translateX(-50%);width:max-content;top:3.5in;font-family:Helvetica,Arial,sans-serif;font-size:6.5pt;color:#E2765E;text-align:center;line-height:1.05;white-space:nowrap}

/* ── ITEM tag: 2.5"×3", 4 cols × 2 rows, printed landscape (page) ──
   Uses your real template PNG as background — logo, headline, body text,
   both navy lines, and the heart are all baked in already. Only three
   overlays, matching your exact spec:
     name/logo   centered horizontally, vertically centered 1.03in–1.46in
     QR code     .4×.4in, left .45in, top 2.46in
     caption     vertically centered 2.49in–2.72in, right of the QR
*/
.page-item{display:grid;grid-template-columns:repeat(4,2.5in);grid-template-rows:repeat(2,3in);gap:0.02in;background:white;page-break-after:always}
.it{width:2.5in;height:3in;overflow:hidden;background-color:white;background-image:var(--it-template-url);background-size:100% 100%;background-repeat:no-repeat;border:none;position:relative;font-family:Calibri,Carlito,sans-serif}
.it-donor{position:absolute;left:6px;right:6px;top:1.04in;height:.41in;display:flex;align-items:center;justify-content:center;overflow:hidden}
.it-donor img{max-width:2in;max-height:min(.41in,100%);object-fit:contain}
.it-donor-name{font-family:'Adobe Garamond Pro','EB Garamond',Garamond,serif;font-variant:small-caps;font-size:14pt;font-weight:600;color:#1B2A4A;text-align:center;line-height:1.2;width:100%;padding:0 3px}
.it-qr-img{width:.39in;height:.39in;position:absolute;left:.62in;top:2.5in}
.it-qr-img img{width:100%;height:100%}
.it-qr-ph{width:.4in;height:.4in;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:5px;color:#aaa;position:absolute;left:.45in;top:2.46in}
.it-qr-lbl{position:absolute;left:1.6in;transform:translateX(-50%);width:max-content;top:2.57in;height:.23in;display:flex;align-items:center;justify-content:center;font-family:Montserrat,Calibri,Carlito,sans-serif;font-size:6pt;color:#4A4E8E;text-align:center;line-height:1.25;white-space:nowrap}

.empty-slot{border:1px dashed #eee;background:#fafafa}
@media print{
  .controls,.page-frame-label,.loading{display:none!important}
  body,html{background:white}
  .sheet{margin:0;width:100%}
  /* Print the tags and nothing else: no empty-slot boxes, no frames, no extra blank page. */
  .empty-slot{visibility:hidden!important;border:none!important;background:none!important}
  .bm,.ct,.it{border:none!important}
  #sheet-wrap > :last-child .page-book,#sheet-wrap > :last-child .page-clothing,#sheet-wrap > :last-child .page-item{page-break-after:auto!important}
}
</style>

<script>

// Donor logos saved to Google Drive come back as a "view" link, which can't be used
// as an image. Turn a Drive link into direct image URLs. The first keeps the ORIGINAL
// file (so a transparent PNG stays transparent); Drive's thumbnail is JPEG and would
// turn transparency black, so it is only the last fallback.
function driveId(u){
  u=String(u||'');
  var m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?[^#]*id=([\w-]+)/);
  return m?m[1]:'';
}
function logoSrc(u){
  var id=driveId(u);
  return id ? 'https://lh3.googleusercontent.com/d/'+id : String(u||'');
}
function logoAlts(u){
  var id=driveId(u);
  return id ? ['https://drive.google.com/uc?export=view&id='+id,'https://drive.google.com/thumbnail?id='+id+'&sz=w2000'].join('|') : '';
}
// Drive logos are fetched through the Apps Script as the exact original file and shown from

var BLANK_GIF="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
var _logoCache={};
function logoAttrs(u){
  var id=driveId(u);
  if(!id) return 'src="'+esc(u)+'" onerror="logoFail(this)"';

}
function getLogoData(id){
  if(!_logoCache[id]){
    _logoCache[id]=fetch(LOGO_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getLogoImage',fileId:id})})
      .then(function(r){return r.json();})
      .then(function(j){ if(!j||!j.success) throw new Error((j&&j.error)||'no data'); return 'data:'+j.mimeType+';base64,'+j.base64; });
  }
  return _logoCache[id];
}
function hydrateLogos(){
  document.querySelectorAll('img[data-drive]:not([data-hyd])').forEach(function(img){
    img.setAttribute('data-hyd','1');
    getLogoData(img.getAttribute('data-drive')).then(function(uri){ img.src=uri; })
      .catch(function(){ img.src=img.getAttribute('data-fallback'); });
  });
}
new MutationObserver(hydrateLogos).observe(document.documentElement,{childList:true,subtree:true});
// onerror: try the next URL, then fall back to the donor's name
function logoFail(img){
  var alts=(img.getAttribute('data-alts')||'').split('|').filter(Boolean);
  if(alts.length){ img.setAttribute('data-alts',alts.slice(1).join('|')); img.src=alts[0]; return; }
  img.style.display='none'; if(img.nextElementSibling) img.nextElementSibling.style.display='block';
}
// Businesses read "the website"; authors use the pronoun on the prize (her by default).
function pronounFor(p){
  var v=p.donorPronoun||'their';
  return (p.donorType==='business' && v==='their') ? 'the' : v;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qr(url,c){return`https://api.qrserver.com/v1/create-qr-code/?size=300x300&color=${c||'000000'}&data=${encodeURIComponent(url||'https://example.com')}`;}
// Since this page opens in its own new tab, window.close() usually works —
// but some browsers block closing a tab a script didn't fully control.
// If that happens, fall back to navigating back to the main app instead of
// leaving the person stuck with no way out.
function closeTagPreview(){
  window.close();
  setTimeout(function(){
    if (!window.closed) {
      window.location.href = 'index.html';
    }
  }, 300);
}
function donorSection(p,nameClass,imgClass){
  if(p.donorLogo) return`<div class="${nameClass.replace('name','')}" style="width:calc(100% - 10px);margin:3px 5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;min-height:.5in"><img ${logoAttrs(p.donorLogo)}><div class="${nameClass}" style="display:none">${esc(p.donor)}</div></div>`;
  return`<div class="${nameClass}">${esc(p.donor)}</div>`;
}

let _allPrizes=[];

function filterPrizes(){
  const type=document.getElementById('type-sel').value;
  const status=document.getElementById('status-sel').value;
  return _allPrizes.filter(p=>{
    if(!p.donor||!p.needTag) return false;
    if(p.bundledInto) return false;
    // donationTagType ('book'/'clothing'/'other') is set per-donation, independent
    // of itemType — an author can donate clothing, a business can donate a book, etc.
    const tagType=p.donationTagType||'book';
    if(type==='book'&&tagType!=='book') return false;
    if(type==='clothing'&&tagType!=='clothing') return false;
    if(type==='item'&&tagType!=='other') return false;
    if(status==='unprinted') return !p.tagGenerated;
    return true;
  });
}

function bookTag(p){
  const pr=pronounFor(p);
  const qrWord=(p.donorQRType&&p.donorQRType!=='website')?'profile':'website';
  const qrDest=p.donorWebsite||p.url||'';
  const logoArea=p.donorLogo
    ?`<div class="bm-donor"><img ${logoAttrs(p.donorLogo)}><div class="bm-donor-name" style="display:none">${esc(p.donor)}</div></div>`
    :`<div class="bm-donor"><div class="bm-donor-name">${esc(p.donor)}</div></div>`;
  // Logo, headline, body, both navy lines, and the heart are all baked
  // into the template background now — only name/logo and QR+caption
  // remain as overlays. No website on file → nothing to scan, so omitted.
  const qrSection=qrDest?`
    <div class="bm-qr-img"><img src="${qr(qrDest)}" alt="QR"></div>
    <div class="bm-qr-lbl">Scan the QR<br>code to visit<br>${esc(pr)} ${qrWord}</div>`:'';
  return`<div class="bm">
    ${logoArea}
    ${qrSection}
  </div>`;
}

function clothingTag(p){
  const pr=pronounFor(p);
  const qrWord=(p.donorQRType&&p.donorQRType!=='website')?'profile':'website';
  const size=p.clothingSize==='Custom'?(p.clothingSizeCustom||''):p.clothingSize||'';
  const isOneSize = p.clothingSize==='One size';
  const qrDest=p.donorWebsite||'';
  const logoArea=p.donorLogo
    ?`<div class="ct-donor"><img ${logoAttrs(p.donorLogo)}><div class="ct-donor-name" style="display:none">${esc(p.donor)}</div></div>`
    :`<div class="ct-donor"><div class="ct-donor-name">${esc(p.donor)}</div></div>`;
  // Hole, logo, ring, headline, body, both navy lines, and the heart are
  // all baked into the template background image now — only the QR code
  // image and the caption text (which has the dynamic pronoun) are real
  // overlays. No website on file → nothing to scan, so it's omitted.
  const qrSection=qrDest?`
    <div class="ct-qr-img"><img src="${qr(qrDest)}" alt="QR"></div>
    <div class="ct-qr-lbl">Scan the QR code to<br>visit ${esc(pr)} ${qrWord}</div>`:'';
  const sizeSection = (isOneSize || !size) ? '' : `<div class="ct-size-value-wrap"><span class="ct-size-value">${esc(size)}</span></div>`;
  return`<div class="ct">
    ${sizeSection}
    ${logoArea}
    ${qrSection}
  </div>`;
}

function itemTag(p){
  const pr=pronounFor(p);
  const qrWord=(p.donorQRType&&p.donorQRType!=='website')?'profile':'website';
  const qrDest=p.donorWebsite||'';
  const logoArea=p.donorLogo
    ?`<div class="it-donor"><img ${logoAttrs(p.donorLogo)}><div class="it-donor-name" style="display:none">${esc(p.donor)}</div></div>`
    :`<div class="it-donor"><div class="it-donor-name">${esc(p.donor)}</div></div>`;
  // Logo, headline, body, both navy lines, and heart are baked into the
  // template background now — only name/logo and QR+caption are overlays.
  const qrSection=qrDest?`
    <div class="it-qr-img"><img src="${qr(qrDest,'454a85')}" alt="QR"></div>
    <div class="it-qr-lbl"><span>Scan the QR code<br>to visit ${esc(pr)} ${qrWord}.</span></div>`:'';
  return`<div class="it">
    ${logoArea}
    ${qrSection}
  </div>`;
}

function setPageOrientation(type){
  let styleEl = document.getElementById('page-orientation-style');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'page-orientation-style';
    document.head.appendChild(styleEl);
  }
  // Clothing table: 10in x 8in (4×2.5in cols, 2×4in rows) — landscape.
  // Item table: 10in x 6in (4×2.5in cols, 2×3in rows) — each tag is
  // portrait-shaped, but 4-across at 2.5in still needs a landscape sheet
  // to fit the 10in width (won't fit an 8.5in-wide portrait page).
  // The page margin is 0 so the browser has no room to print its own header/footer
  // (page title, web address, date). The old margins are applied as padding instead.
  styleEl.textContent = (type==='clothing' || type==='item')
    ? '@page { size: letter landscape; margin: 0; } @media print { .sheet { padding: 0.25in 0.5in 0; } }'
    : '@page { size: letter portrait; margin: 0; } @media print { .sheet { padding: 0.5in 0.25in 0; } }';
}

function buildSheets(){
  const type=document.getElementById('type-sel').value;
  setPageOrientation(type);
  const filtered=filterPrizes();
  // One donated article can have qty > 1 (e.g. a donor gave 8 of the same
  // shirt) — expand each prize into `qty` individual tags rather than
  // printing just one tag per database record.
  const prizes=[];
  filtered.forEach(p=>{
    const n = Math.max(1, +p.qty||1);
    for(let i=0;i<n;i++) prizes.push(p);
  });
  const wrap=document.getElementById('sheet-wrap');
  document.getElementById('loading').style.display='none';
  if(!prizes.length){wrap.innerHTML=`<div class="loading">No matching prizes found for this tag type and filter.</div>`;return;}
  const PER=8;
  const pageClass=type==='book'?'page-book':type==='clothing'?'page-clothing':'page-item';
  const tagFn=type==='book'?bookTag:type==='clothing'?clothingTag:itemTag;
  const emptyClass=type==='book'?'bm':type==='clothing'?'ct':'it';
  let html='';
  for(let i=0;i<prizes.length;i+=PER){
    const batch=prizes.slice(i,i+PER);
    while(batch.length<PER) batch.push(null);
    const sheetHtml=`<div class="sheet"><div class="${pageClass}">${batch.map(p=>p?tagFn(p):`<div class="${emptyClass} empty-slot"></div>`).join('')}</div></div>`;
    html+=type==='book'
      ? `<div class="page-frame"><div class="page-frame-label">8.5" × 11" sheet — dashed line shows the 8" × 10" tag table (0.25in side / 0.5in top-bottom margin)</div>${sheetHtml}</div>`
      : type==='clothing'
      ? `<div class="page-frame landscape"><div class="page-frame-label">11" × 8.5" landscape sheet — dashed line shows the 10" × 8" tag table (0.5in side / 0.25in top-bottom margin)</div>${sheetHtml}</div>`
      : sheetHtml;
  }
  wrap.innerHTML=html;
  document.getElementById('ctrl-title').textContent=`🔖 ${prizes.length} ${type} tag${prizes.length!==1?'s':''}`;
  if(type==='clothing') fitSizeValues();
}

// Safety net for the size circle: at 20pt, most sizes (S, M, L, XL) fit
// fine, but a longer label (XXXL, or a custom size) could overflow the
// smaller .65in circle. Shrinks that specific label — and only that
// label — down in small steps until it fits, never touching anything else.
function fitSizeValues(){
  document.querySelectorAll('.ct-size-value').forEach(el=>{
    const wrap=el.parentElement;
    let size=20;
    el.style.fontSize=size+'pt';
    while(el.scrollWidth>wrap.clientWidth && size>10){
      size-=0.5;
      el.style.fontSize=size+'pt';
    }
  });
}

async function doPrint(){
  // Mark all currently displayed prizes as tagGenerated
  const prizes=filterPrizes();
  const ids=prizes.map(p=>p.id);
  if(DB&&ids.length){
    try{
      for(const id of ids){
        await fetch(`${DB}/prizes/${id}/tagGenerated.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:'true'});
        await fetch(`${DB}/prizes/${id}/tagMade.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:'true'});
      }
    }catch(e){console.warn('Could not mark tags as generated:',e);}
  }
  window.print();
}

async function loadPrizes(){
  if(!DB){document.getElementById('loading').innerHTML='<b>Firebase URL not set.</b> Open this page from the Prize Manager app.';return;}
  try{
    const res=await fetch(DB+'/prizes.json');
    const data=await res.json();
    _allPrizes=data?Object.values(data):[];
    buildSheets();
  }catch(e){document.getElementById('loading').innerHTML='Could not load prizes. Check your Firebase URL.';}
}

loadPrizes();

// Set logo once available
function applyLogo(){
  const src = window.SOIREE_LOGO_2027 || '';
  document.querySelectorAll('#bm-logo-img,.tag-logo-img').forEach(img=>{ img.src=src; });
}
// Re-apply after sheets are built
const _origBuildSheets = buildSheets;
buildSheets = function(){
  _origBuildSheets();
  setTimeout(applyLogo, 50);
};
// Apply on logo script load
window.addEventListener('load', applyLogo);

</script>
